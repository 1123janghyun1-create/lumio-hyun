<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />

  <!-- Outer Hexagon -->
  <polygon points="256,92 402,176 402,344 256,428 110,344 110,176" 
           fill="none" stroke="url(#hexGrad)" stroke-width="38" 
           stroke-linejoin="round" stroke-linecap="round" />

  <!-- Inner Spark / Maker Core Hexagon -->
  <polygon points="256,192 318,228 318,298 256,334 194,298 194,228" 
           fill="url(#coreGrad)"
           stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
</svg>
